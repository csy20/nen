name: nen
description: "Nen — Offline music player with real-time audio visualizer."
publish_to: 'none'
version: 1.0.8+10

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Audio engine
  flutter_soloud: ^3.1.5
  just_audio: ^0.10.4
  audio_session: ^0.2.2

  # Media query (on-device songs, albums, artists)
  on_audio_query: ^2.9.0

  # Permissions
  permission_handler: ^11.4.0

  # Palette extraction from album art
  palette_generator: ^0.3.3+4

  # Path utilities
  path: ^1.9.1

  # Scoped-safe file paths (export/import)
  path_provider: ^2.1.5

  # Background audio / lock-screen controls
  audio_service: ^0.18.17

  # Shared preferences for settings
  shared_preferences: ^2.5.3

  # SQLite storage for persistent playlists
  sqflite: ^2.4.2

  # UUID generation for playlists
  uuid: ^4.5.1

  # Collection utilities
  collection: ^1.19.1

  # Marquee scrolling text widget
  marquee: ^2.2.3

  # In-app review with Play Store listing fallback
  in_app_review: ^2.0.12
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  shaders:
    - shaders/visualizer.frag
